      return vaMiss()}
    case "type":{const ty=vaMatchType(alts);if(!ty)return vaMiss("ما عرفت النوع.");
      const o=vaObs();if(o){o.type=ty;saveVisit(v)}return vaGo("desc",ty+".")}
    case "desc":{if(t.length<2)return vaMiss();const o=vaObs();if(o){o.desc=t;saveVisit(v)}return vaGo("action","سجّلت: "+t+".")}
    case "action":{const o=vaObs();let a=null;
      if(/مخالف|حرر|تحرير/.test(n)&&!/(^| )(ما|لا|بدون|مافي|ما في)( |$)/.test(n))a=A_VIOL;
      else if(/مشاهد|بس|فقط|بدون|ما في|مافي|لا/.test(n))a=A_OBS;
      if(!a)return vaMiss();if(o){o.action=a;saveVisit(v)}
      return vaGo("photo",a===A_VIOL?"تم تحرير مخالفة.":"مشاهدة فقط.")}
    case "photo":
      if(/(^| )(لا|ما|خلاص|خلصت|بس|تم|كمل|كفايه|تخطي|التالي|مافي|ما في|بعدين)( |$)/.test(n))return vaGo("more",VA.shots?(VA.shots===1?"صورة واحدة.":vaPics(VA.shots)):"بدون صور.");
      if(/صور|التقط|كليك|شوت|صوره/.test(n))return vaShoot();
      return vaMiss();
    case "finish":
      if(yn==="yes")return vaFinish();
      if(yn==="no"){speak("تمام، الزيارة باقية مفتوحة. كمّلها من الشاشة.");return vaStop(true)}
      return vaMiss();
    case "cancel":
      if(yn==="yes")return vaCancel();
      if(yn==="no")return vaGo(VA.tmp&&VA.tmp.ret||"area","نكمل.",true);
      return vaMiss();
  }}
function vaBack(){
  if(VA_TRANSIENT.has(VA.step))return vaGo((VA.tmp&&VA.tmp.ret)||"area","",true);
  const prev=VA.hist.pop();if(!prev)return vaAsk("هذي أول خطوة.");
  const v=vaVisit();
  if(prev==="hasObs"||prev==="more"){
    if(VA.fresh){const o=v.obs.find(x=>x.id===VA.fresh);if(o&&!o.photos.length)v.obs=v.obs.filter(x=>x.id!==VA.fresh);VA.fresh=null}
    if(prev==="hasObs")v.obs=v.obs.filter(x=>x.type!==NO_OBS);
    const real=v.obs.filter(x=>x.type!==NO_OBS);VA.oid=real.length?real[real.length-1].id:null;saveVisit(v)}
  if(prev==="photo"){const o=vaObs();VA.shots=o?o.photos.length:0}
  vaGo(prev,"رجعنا.",true)}
async function vaShoot(){const g=++VA.gen;VA.mode="busy";vaRender();
  const ok=await vaCapture();if(g!==VA.gen||!VA.on)return;
  vaAsk(ok?"تم، صورة "+VA.shots+".":"ما قدرت أصوّر.")}
async function vaCamOn(){
  if(VA.stream)return true;
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
    VA.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1440}},audio:false});
    if(!VA.on){vaCamOff();return false}
    const vd=$("#vaCam");vd.srcObject=VA.stream;vd.hidden=false;await vd.play().catch(()=>{});
    for(let i=0;i<30&&!vd.videoWidth;i++)await new Promise(r=>setTimeout(r,100));
    vaRender();return true}catch(e){vaCamOff();return false}}
function vaCamOff(){if(VA.stream){VA.stream.getTracks().forEach(t=>t.stop());VA.stream=null}
  const vd=$("#vaCam");if(vd){try{vd.pause()}catch(e){}vd.srcObject=null;vd.hidden=true}}
async function vaCapture(){
  const vd=$("#vaCam"),v=vaVisit(),o=vaObs();if(!VA.stream||!vd||!vd.videoWidth||!v||!o)return false;
  const c=document.createElement("canvas");c.width=vd.videoWidth;c.height=vd.videoHeight;c.getContext("2d").drawImage(vd,0,0);
  const fl=$("#vaFlash");if(fl){fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on")}
  try{const raw=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),"image/jpeg",0.92));
    await storePhoto(v,o,raw,new Date());VA.shots++;saveVisit(v,true);vaRender();return true}catch(e){return false}}
function vaPics(n){return n===1?"صورة وحدة.":n===2?"صورتين.":n+" صور."}
function vaSummary(v){const s=stats([v]);const parts=["انحفظت زيارة "+(v.site||v.area||"")+"."];
  parts.push(s.obs?(s.obs===1?"مشاهدة وحدة":s.obs+" مشاهدات")+(s.viol?"، و"+(s.viol===1?"مخالفة وحدة":s.viol+" مخالفات"):"")+".":"بدون مشاهدات.");
  if(s.pics)parts.push(vaPics(s.pics));
  parts.push(v.lat?"الإحداثيات مسجلة.":"ما انسجلت الإحداثيات، أضفها من الشاشة.");
  parts.push("المغادرة "+v.departure+".");return parts.join(" ")}
async function vaFinish(){const v=vaVisit();if(!v)return vaStop();
  v.obs=v.obs.filter(o=>o.type);if(!v.obs.length)v.obs=[{id:uid(),type:NO_OBS,desc:"",action:A_NONE,photos:[]}];
  v.departure=hhmm(new Date());v.status="done";await saveVisit(v,true);
  const g=++VA.gen;VA.mode="speak";VA.say=vaSummary(v);vaCamOff();vaRender();
  await speak(VA.say);if(g!==VA.gen)return;
  vaClose();S.view="today";S.editId=null;render();toast("تم حفظ الزيارة")}
async function vaCancel(){const v=vaVisit();const g=++VA.gen;vaCamOff();if(v)await removeVisit(v);
  VA.mode="speak";VA.say="انلغت الزيارة.";vaRender();await speak(VA.say);if(g!==VA.gen)return;
  vaClose();S.view="today";S.editId=null;render()}
/* stop button / «وقف»: keep what was recorded and hand over to the screen */
function vaStop(keepSpeech){
  if(!VA.on)return;const v=vaVisit();
  if(!keepSpeech){try{window.speechSynthesis.cancel()}catch(e){}}
  vaClose();
  if(v&&!v.site&&!v.obs.length){removeVisit(v).then(()=>render());S.view="today";toast("وقف المساعد، وما انحفظت زيارة");return render()}
  if(v){v.obs=v.obs.filter(o=>o.type||o.desc||o.photos.length);saveVisit(v,true);S.view="visit";S.editId=v.id;S.addingSite=false;toast("وقف المساعد. كمّل الزيارة من هنا")}
  render()}
function vaClose(){VA.on=false;VA.gen++;VA.mode="";
  if(VA.rec){try{VA.rec.abort()}catch(e){}VA.rec=null}
  vaCamOff();if(VA.lock){VA.lock.release().catch(()=>{});VA.lock=null}
  $("#va").hidden=true;document.documentElement.style.overflow=""}
function vaQuick(){const st=S.settings;
  const b=(v,l,c)=>`<button class="va-q ${c||""}" data-va="ans" data-v="${esc(v)}">${esc(l||v)}</button>`;
  switch(VA.step){
    case "area":return Object.keys(st.areas).map(a=>b(a)).join("");
    case "site":{const v=vaVisit();return((v&&st.areas[v.area])||[]).map(s=>b(s)).join("")}
    case "type":return st.types.filter(t=>t!==NO_OBS).map(t=>b(t)).join("");
    case "action":return b("مخالفة","تم تحرير مخالفة","v")+b("مشاهدة بس","مشاهدة فقط","o");
    case "photo":return b("خلاص","خلاص، كمّل");
    case "desc":return "";
    default:return b("نعم","نعم","y")+b("لا","لا","n")}}
function vaRender(){
  const el=$("#va");if(!el||el.hidden)return;const v=vaVisit();
  const st={speak:"يتكلم…",listen:"أسمعك… تكلّم",busy:"لحظة…",wait:"متوقف"}[VA.mode]||"";
  el.dataset.mode=VA.mode||"";
  $("#vaState").textContent=st;
  const s=v?stats([v]):null;
  $("#vaCtx").textContent=v?[v.area||"—",v.site||"—",(v.obs.filter(o=>o.type&&o.type!==NO_OBS).length)+" مشاهدة",s.pics+" صور",v.lat?"📍":""].filter(Boolean).join(" · "):"";
  $("#vaSay").textContent=VA.say;
  $("#vaHeard").textContent=VA.heard?"سمعت: «"+VA.heard+"»":"";
  const cam=VA.step==="photo"&&VA.stream;$("#vaCamBox").hidden=!cam;$("#vaShots").textContent=VA.shots?VA.shots+" 📷":"";
  $("#vaQuick").innerHTML=VA.mode==="wait"?"":vaQuick();
  $("#vaTalk").hidden=VA.mode!=="wait"}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-va]");if(!b||!VA.on)return;
  const k=b.dataset.va;
  if(k==="stop")return vaStop();
  if(k==="repeat")return vaAsk();
  if(k==="back")return vaBack();
  if(k==="shoot"){if(VA.step==="photo")vaShoot();return}
  if(k==="talk"){VA.viaTap=true;VA.silent=0;const g=++VA.gen;return vaListen(g)}   // starts the mic inside the tap
  if(k==="ans"){if(VA.rec){try{VA.rec.abort()}catch(e){}}try{window.speechSynthesis.cancel()}catch(e){}VA.gen++;return vaHandle([b.dataset.v])}
});
document.addEventListener("visibilitychange",()=>{if(!VA.on)return;
  if(document.hidden){VA.gen++;if(VA.rec){try{VA.rec.abort()}catch(e){}}try{window.speechSynthesis.cancel()}catch(e){}VA.mode="wait";VA.say="متوقف. اضغط «تكلّم» عشان نكمل.";}
  else if(VA.mode==="wait")vaAsk("نكمل.")});
window.__va={VA,fuzzy,bestMatch,yesNo,arKey};

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const tab=e.target.closest(".tab");
  if(tab){S.view=tab.dataset.tab;S.armed=null;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=visit(S.editId);
  if(S.armed&&!["wipe","delVisit","rmObs"].includes(act))S.armed=null;
  switch(act){
    case "new":return newVisit();
    case "va":return vaStart();
    case "edit":S.view="visit";S.editId=b.dataset.id;S.addingSite=false;S.addingType=null;S.armed=null;return render();
    case "back":S.view="today";S.editId=null;S.armed=null;return render();
    case "area":if(!v)return;v.area=b.dataset.v;if(!(S.settings.areas[v.area]||[]).includes(v.site))v.site="";S.addingSite=false;saveVisit(v);return render(true);
    case "saveSite":{const inp=$("#newSite");const n=(inp&&inp.value||"").trim();if(!n||!v)return toast("اكتب اسم الموقع");
      const l=S.settings.areas[v.area];if(!l.includes(n)){l.push(n);await saveSettings()}v.site=n;S.addingSite=false;saveVisit(v);toast("أضيف «"+n+"» للقائمة");return render(true)}
    case "cancelSite":S.addingSite=false;return render(true);
    case "locate":if(v)locate(v);return;
    case "clearCoord":if(v){v.lat=v.lng=v.acc="";saveVisit(v);render(true)}return;
    case "leaveNow":if(v){v.departure=hhmm(new Date());saveVisit(v);render(true)}return;
    case "addObs":if(v){v.obs.push({id:uid(),type:"",desc:"",action:A_OBS,photos:[]});saveVisit(v);render(true);
      setTimeout(()=>{const c=document.querySelector(`.obs-card[data-oid="${v.obs[v.obs.length-1].id}"]`);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},50)}return;
    case "noObs":if(v){v.obs=[{id:uid(),type:NO_OBS,desc:"",action:A_NONE,photos:[]}];saveVisit(v);render(true)}return;
    case "rmObs":{if(!v)return;const id=b.dataset.oid;const o=v.obs.find(x=>x.id===id);if(!o)return;
      const empty=!o.desc&&!o.photos.length&&(!o.type||o.type===NO_OBS);
      if(!empty&&S.armed!=="o"+id){S.armed="o"+id;render(true);setTimeout(()=>{if(S.armed==="o"+id){S.armed=null;render(true)}},4000);return}
      for(const p of o.photos){await delPhoto(p)}
      v.obs=v.obs.filter(x=>x.id!==id);S.armed=null;saveVisit(v);return render(true)}
    case "action":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(o){o.action=b.dataset.v;saveVisit(v);render(true)}return}
    case "saveTypeInline":{const n=($("#newTypeInline")||{}).value;const t=(n||"").trim();if(!t)return toast("اكتب اسم النوع");
      if(!S.settings.types.includes(t)){S.settings.types.push(t);await saveSettings()}
      const o=v&&v.obs.find(x=>x.id===b.dataset.oid);if(o)o.type=t;S.addingType=null;if(v)saveVisit(v);toast("أضيف «"+t+"» للأنواع");return render(true)}
    case "cancelType":S.addingType=null;return render(true);
    case "cam":pendingObs=b.dataset.oid;$("#camIn").value="";return $("#camIn").click();
    case "gal":pendingObs=b.dataset.oid;$("#galIn").value="";return $("#galIn").click();
    case "rmPhoto":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(!o)return;o.photos=o.photos.filter(p=>p!==b.dataset.pid);
      await delPhoto(b.dataset.pid);saveVisit(v);return render(true)}
    case "mic":return dictate(b.dataset.oid,b);
    case "finish":{if(!v)return;if(!v.area||!v.site)return toast("اختر المنطقة والموقع قبل الإنهاء");
      if(v.obs.some(o=>!o.type))return toast("حدد نوع كل مشاهدة، أو احذف الفاضية");
      if(!v.departure)v.departure=hhmm(new Date());v.status="done";await saveVisit(v,true);
      S.view="today";S.editId=null;toast("تم حفظ الزيارة");return render()}
    case "delVisit":{if(!v)return;if(S.armed!=="visit"){S.armed="visit";render(true);setTimeout(()=>{if(S.armed==="visit"){S.armed=null;render(true)}},4000);return}
      await removeVisit(v);S.armed=null;S.view="today";S.editId=null;toast("تم حذف الزيارة");return render()}
    case "range":S.range=b.dataset.v;return render(true);
    case "zip":return doExport(true);
    case "report":return doExport(false);
    case "addSite":{const a=b.dataset.a;const inp=document.querySelector(`[data-addsite="${CSS.escape(a)}"]`);const n=(inp&&inp.value||"").trim();if(!n)return;
      if(!S.settings.areas[a].includes(n))S.settings.areas[a].push(n);await saveSettings();toast("أضيف «"+n+"»");render(true);
      const d=[...document.querySelectorAll("details.area")].find(x=>x.querySelector("summary span").textContent===a);if(d)d.open=true;return}
    case "rmSite":{const a=b.dataset.a;S.settings.areas[a].splice(+b.dataset.i,1);await saveSettings();render(true);
      const d=[...document.querySelectorAll("details.area")].find(x=>x.querySelector("summary span").textContent===a);if(d)d.open=true;return}
    case "addArea":{const n=($("#newArea").value||"").trim();if(!n)return;if(!S.settings.areas[n])S.settings.areas[n]=[];await saveSettings();toast("أضيفت منطقة «"+n+"»");return render(true)}
    case "addType":{const n=($("#newType").value||"").trim();if(!n)return;if(!S.settings.types.includes(n))S.settings.types.push(n);await saveSettings();return render(true)}
    case "rmType":S.settings.types.splice(+b.dataset.i,1);await saveSettings();return render(true);
    case "siri":$("#siriIn").value="";return $("#siriIn").click();
    case "copyPrompt":{const t=($("#drivePrompt")||{}).textContent||"";
      try{await navigator.clipboard.writeText(t);toast("تم النسخ")}catch(e){const r=document.createRange();const el=$("#drivePrompt");if(el){r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast("حدّدت النص، اضغط نسخ")}return}
    case "impOpen":S.importOpen=true;render(true);setTimeout(()=>{const t=$("#impText");if(t)t.focus()},50);return;
    case "impClose":S.importOpen=false;return render(true);
    case "impPaste":{const t=($("#impText")||{}).value||"";if(!t.trim())return toast("الصق رد المساعد أول");S.importOpen=false;return importSiri(t)}
    case "ask":{const q=$("#aiQ");const t=q?q.value:"";if(q)q.value="";return askAI(t)}
    case "askSug":return askAI(b.dataset.q);
    case "clearChat":S.chat=[];return render(true);
    case "aiSummary":return aiSummary();
    case "formal":return aiFormal(b.dataset.oid);
    case "undoFormal":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(o&&S.undo[o.id]!=null){o.desc=S.undo[o.id];delete S.undo[o.id];saveVisit(v);render(true)}return}
    case "wipe":if(S.armed!=="wipe"){S.armed="wipe";render(true);setTimeout(()=>{if(S.armed==="wipe"){S.armed=null;render(true)}},5000);return}
      for(const v of S.visits){for(const o of v.obs)for(const p of o.photos)await delPhoto(p);if(Cloud.ok){try{await Cloud.col.doc(v.id).delete()}catch(e){}}}
      await DB.clear("visits").catch(()=>{});await DB.clear("photos").catch(()=>{});S.visits=[];S.dirty.clear();S.armed=null;toast("تم حذف كل البيانات");return render();
  }
});
document.addEventListener("input",e=>{
  const t=e.target,v=visit(S.editId);
  if(t.id==="setName"){S.settings.name=t.value;saveSettingsSoon();return}
  if(t.id==="repNote"){setNote(t.value);return}
  if(t.id==="coordPaste"&&v){const c=parseCoords(t.value);if(c){v.lat=c[0];v.lng=c[1];v.acc="";saveVisit(v);render(true);toast("تم حفظ الإحداثيات")}return}
  if(!v)return;
  if(t.dataset.vf){if(t.dataset.vf==="date"&&!t.value)return;v[t.dataset.vf]=t.value;saveVisit(v);if(t.dataset.vf==="date"){renderTop();}return}
  if(t.dataset.of==="desc"){const o=v.obs.find(x=>x.id===t.dataset.oid);if(o){o.desc=t.value;saveVisit(v)}}
});
document.addEventListener("change",e=>{
  const t=e.target,v=visit(S.editId);
  if(t.id==="rFrom"){S.from=t.value;return render(true)}
  if(t.id==="rTo"){S.to=t.value;return render(true)}
  if(t.id==="siteSel"&&v){if(t.value==="__new"){S.addingSite=true;return render(true)}v.site=t.value;saveVisit(v);return}
  if(t.dataset.of==="type"&&v){const o=v.obs.find(x=>x.id===t.dataset.oid);if(!o)return;
    if(t.value==="__new"){S.addingType=o.id;return render(true)}o.type=t.value;saveVisit(v);return render(true)}
  if(t.dataset.vf==="date"&&v)render(true);
  if(t.id==="siriIn"){const f=t.files&&t.files[0];if(f)importSiri(f);return}
  if(t.id==="camIn"||t.id==="galIn"){const fs=[...t.files];if(fs.length)addPhotos(fs)}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;
  if(t.id==="newSite"){e.preventDefault();document.querySelector('[data-act="saveSite"]').click()}
  if(t.id==="newTypeInline"){e.preventDefault();document.querySelector('[data-act="saveTypeInline"]').click()}
  if(t.dataset&&t.dataset.addsite){e.preventDefault();t.nextElementSibling.click()}
  if(t.id==="newArea"){e.preventDefault();document.querySelector('[data-act="addArea"]').click()}
  if(t.id==="newType"){e.preventDefault();document.querySelector('[data-act="addType"]').click()}
  if(t.id==="aiQ"&&!e.shiftKey){e.preventDefault();document.querySelector('[data-act="ask"]').click()}
});

/* ---------------- boot ---------------- */
(async function boot(){
  S.settings=defaults();render();
  const ok=await DB.open();if(!ok)S.storageWarn=true;
  try{const st=await DB.get("kv","settings");if(st&&st.areas)S.settings=st}catch(e){}
  try{S.visits=(await DB.all("visits"))||[]}catch(e){S.visits=[]}
  try{S.lastExport=(await DB.get("kv","lastExport"))||null}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  render(true);
  await ai();
  const cloud=await Cloud.init();S.cloudChecked=true;
  if(cloud){
    try{const a=await Cloud.app.get();
      if(a.exists){const d=a.data();if(d.settings&&d.settings.areas)S.settings=JSON.parse(JSON.stringify(d.settings));if(d.lastExport)S.lastExport=d.lastExport;DB.put("kv",S.settings,"settings").catch(()=>{})}
      else pushApp()}catch(e){}
    try{const snap=await Cloud.col.get();const remote=new Map();snap.docs.forEach(d=>{if(d.exists)remote.set(d.id,JSON.parse(JSON.stringify(d.data())))});
      const merged=new Map(remote);
      for(const v of S.visits){const r=remote.get(v.id);if(!r||(v.updatedAt||0)>(r.updatedAt||0)){merged.set(v.id,v);S.dirty.add(v.id)}}
      S.visits=[...merged.values()];
      for(const v of S.visits)DB.put("visits",v).catch(()=>{});
    }catch(e){}
    syncPending();
  }
  if(S.view==="visit"&&!visit(S.editId)){S.view="today";S.editId=null}
  render(true);
})();
})();
</script>
