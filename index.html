<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر التفتيش">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>دفتر التفتيش الميداني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one-hand field tool — sticky header, single column of task cards, bottom tab bar within thumb reach */
:root{
  --bg:#EBF0EC; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#13231C; --muted:#5B6C64; --line:#D3DDD7;
  --accent:#0E6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --viol:#BE3326; --viol-soft:#FBE3E0; --obs:#A86F12; --obs-soft:#F8ECD2; --ok:#2C6E8F; --ok-soft:#DDEDF5;
  --shadow:0 1px 2px rgba(19,35,28,.06),0 6px 18px rgba(19,35,28,.06);
  --f-display:"Reem Kufi","Readex Pro",Tahoma,Arial,sans-serif;
  --f-body:"Readex Pro",Tahoma,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#16211C; --surface-2:#1C2923; --ink:#E4ECE7; --muted:#93A59C; --line:#29382F;
  --accent:#3DBB8E; --accent-ink:#06140E; --accent-soft:#183A2D;
  --viol:#F0705F; --viol-soft:#3A1E1A; --obs:#E2A94A; --obs-soft:#3A2D14; --ok:#6FB7DA; --ok-soft:#16303D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#16211C; --surface-2:#1C2923; --ink:#E4ECE7; --muted:#93A59C; --line:#29382F;
  --accent:#3DBB8E; --accent-ink:#06140E; --accent-soft:#183A2D;
  --viol:#F0705F; --viol-soft:#3A1E1A; --obs:#E2A94A; --obs-soft:#3A2D14; --ok:#6FB7DA; --ok-soft:#16303D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:0;margin:0;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-size:.72rem;font-weight:400;opacity:.85}
.top .who{font-size:.8rem;opacity:.9;text-align:left}
main{padding-block:16px 120px}
.stack{display:flex;flex-direction:column;gap:14px}

/* tabs */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
.tab{background:none;border:0;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.78rem}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}

/* cards & type */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2.sec{font-family:var(--f-display);font-size:1.12rem;font-weight:600;margin:6px 2px 0;text-wrap:balance}
.card h3{font-size:.95rem;font-weight:600;margin:0 0 10px;color:var(--muted);letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

/* day header */
.day{display:flex;flex-direction:column;gap:6px}
.day-date{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.viol{background:var(--viol-soft);color:var(--viol)}
.pill.obs{background:var(--obs-soft);color:var(--obs)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.live{background:var(--accent);color:var(--accent-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:500;min-height:46px;text-align:center}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{width:100%;min-height:60px;font-size:1.1rem;border-radius:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--viol);border-color:var(--viol-soft)}
.btn.danger.armed{background:var(--viol);color:#fff;border-color:var(--viol)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.btn{flex:1 1 140px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.v b{color:var(--accent)} .stat.o b{color:var(--obs)} .stat.x b{color:var(--viol)}

/* visit rows */
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.vtime{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.9rem;min-width:44px}
.vmain{min-width:0;display:flex;flex-direction:column}
.vmain b{font-weight:600;overflow-wrap:anywhere}
.vmain span{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.live-card{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live-card b{display:block}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;color:var(--ink);font-size:1rem}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:.92rem;min-height:40px;position:relative}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;min-height:52px;font-weight:600}
.seg button.v[aria-pressed="true"]{background:var(--viol);border-color:var(--viol);color:#fff}
.seg button.o[aria-pressed="true"]{background:var(--obs);border-color:var(--obs);color:#fff}
.hint{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:3px;stroke:currentColor;fill:none;stroke-width:1.8}
.coord{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.coord b{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.obs-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.obs-card.is-viol{border-color:var(--viol);box-shadow:inset 4px 0 0 var(--viol)}
.obs-card.is-obs{border-color:var(--obs);box-shadow:inset 4px 0 0 var(--obs)}
.obs-card.is-none{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.obs-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.obs-head b{font-family:var(--f-display);font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.mic.rec{background:var(--viol);border-color:var(--viol);color:#fff}
.footer-bar{position:fixed;inset:auto 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.footer-bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.footer-bar .btn{flex:1}
.saved{font-size:.75rem;color:var(--muted);white-space:nowrap}
.back{background:none;border:0;color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px;font-weight:600;padding:6px 0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
details.area{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface-2)}
details.area summary{padding:12px 0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
details.area[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.rm-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:.88rem}
.rm-chip button{border:0;background:var(--surface-2);border-radius:50%;width:24px;height:24px;line-height:1;color:var(--muted)}
.addline{display:flex;gap:8px;margin-block:10px 12px}
.addline .inp{min-height:44px}
.addline .btn{min-height:44px;flex:none}
.week-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 2px 0}
.week-h b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
ol.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.banner{background:var(--obs-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.88rem}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
 .chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.msg.me{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-end;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:52px}
.composer .btn{flex:none}
.siri-help{font-size:.9rem;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.siri-help pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font-family:inherit;font-size:.85rem;margin:0}
.siri-help ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.pill.siri{background:var(--ok-soft);color:var(--ok)}
/* المساعد الآلي — full-screen, dark, huge targets: glanceable while driving */
.va{position:fixed;inset:0;z-index:60;background:#0B1310;color:#F2F6F3;display:flex;flex-direction:column;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.va-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.va-state{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:#9FB3A9}
.va-state::before{content:"";width:14px;height:14px;border-radius:50%;background:#4A5A52}
.va[data-mode="listen"] .va-state{color:#3DDC97}.va[data-mode="listen"] .va-state::before{background:#3DDC97;animation:vaPulse 1s ease-in-out infinite}
.va[data-mode="speak"] .va-state{color:#7CC4F0}.va[data-mode="speak"] .va-state::before{background:#7CC4F0}
.va[data-mode="wait"] .va-state{color:#E2A94A}.va[data-mode="wait"] .va-state::before{background:#E2A94A}
@keyframes vaPulse{50%{transform:scale(1.5);opacity:.5}}
.va-ctx{font-size:.85rem;color:#9FB3A9;text-align:left}
.va-say{font-family:var(--f-display);font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.va-heard{font-size:1.05rem;color:#C9D6CF;min-height:1.6em;overflow-wrap:anywhere}
.va-cam{position:relative;border-radius:16px;overflow:hidden;background:#000;flex:1 1 220px;min-height:200px;max-height:48vh}
.va-cam video{width:100%;height:100%;object-fit:cover;display:block}
.va-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.va-flash.on{animation:vaFlash .35s ease-out}
@keyframes vaFlash{from{opacity:.85}to{opacity:0}}
.va-shots{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border-radius:999px;padding:2px 10px;font-weight:700}
.va-shoot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.35)}
.va-quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.va-q{flex:1 1 130px;min-height:58px;border-radius:14px;border:1.5px solid #2E3E36;background:#16211C;color:#F2F6F3;font-size:1.05rem;font-weight:600;padding:8px 12px}
.va-q.y{background:#0E6A4E;border-color:#0E6A4E}.va-q.v{background:#BE3326;border-color:#BE3326}.va-q.o{background:#A86F12;border-color:#A86F12}
.va-talk{min-height:110px;border-radius:20px;border:0;background:#1F9D6B;color:#fff;font-size:1.6rem;font-weight:700}
.va-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.va-nav button{min-height:58px;border-radius:14px;border:1.5px solid #2E3E36;background:transparent;color:#F2F6F3;font-size:1.1rem;font-weight:600}
.va-stop{min-height:84px;border-radius:20px;border:0;background:#D63A2B;color:#fff;font-size:1.7rem;font-weight:700;flex:none}
.btn.va-go{background:#13231C;border-color:#13231C;color:#fff;font-weight:700}
/* survey (زيارة معاينة) */
:root{--sv:#5B3FA0;--sv-soft:#ECE6F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sv:#B7A2EC;--sv-soft:#2A2340}}
:root[data-theme="dark"]{--sv:#B7A2EC;--sv-soft:#2A2340}
.pill.surv{background:var(--sv-soft);color:var(--sv)}
.pill.duty{background:#E3EAF7;color:#1E3A8A}
.pill.review{background:#FFE0B2;color:#9A3412}
.inp.ro{background:var(--bg,#f4f6f5);color:inherit;display:flex;align-items:center;min-height:44px}
.day-st{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid rgba(0,0,0,.06)}
.day-st:first-of-type{border-top:0}
.day-st .chips{gap:6px}
.btn.sv-go{border:1.5px solid var(--sv);color:var(--sv);background:var(--surface);font-weight:600}
.sv-tag{display:flex;align-items:center;gap:10px;background:var(--sv-soft);color:var(--sv);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem}
.sv-tag svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button.y[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.n[aria-pressed="true"]{background:var(--obs);border-color:var(--obs);color:#fff}
.stepper{display:grid;grid-template-columns:46px 1fr 46px;gap:6px;align-items:center}
.stepper button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:1.35rem;font-weight:600;line-height:1}
.stepper .inp{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:8px 4px}
.pdf-pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pdf-pages img{height:200px;width:auto;border:1px solid var(--line);border-radius:6px;background:#fff;flex:none}
:root[data-theme="dark"] .btn.va-go{background:#3DBB8E;border-color:#3DBB8E;color:#06140E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.va-go{background:#3DBB8E;border-color:#3DBB8E;color:#06140E}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.stats{gap:6px}.stat b{font-size:1.4rem}.grid2{grid-template-columns:1fr}}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="wrap" id="topbar"></div></header>
  <main><div class="wrap stack" id="view"></div></main>
  <nav class="tabs" id="tabs" aria-label="التنقل"><div class="wrap">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>اليوم</button>

<script>
(function(){
"use strict";
/* ---------------- constants ---------------- */
const NO_OBS="لا توجد مشاهدات", A_VIOL="تم تحرير مخالفة", A_OBS="مشاهدة فقط", A_NONE="لا يوجد";
const SURV="معاينة مزرعة", A_SURV="معاينة";
const DEFAULT_COMPANIES=["شركة العيون لحفر الآبار","شركة بازلت لحفر الآبار","شركة الأنهار لحفر الآبار"];
const DEFAULT_AREAS={
  "ليوا":["الثروانية","الجبانة","مزيرعة","حميم","بوعوانة","اليارية","موقب","الخيس","نشاش","وذين","اليبانة","يرّة","موصل","قرمدة","نفير","الرايقة","المارية","المارية الغربية","عتاب","خنّور","الحميضي","الصبخة","حفيف","قطوف","الهيلة","عرادة","ملقطة","العيد","أم القرين","العاطر","الهذي","المشرب","مهدر بن عصيان"],
  "حبشان":["حبشان الشرقية","حبشان الغربية"],
  "الرويس":["الرويس"],"المرفأ":["المرفأ","الطريف"],"غياثي":["غياثي"],"السلع":["السلع"],"مدينة زايد":["مدينة زايد"]
};
const DEFAULT_TYPES=["حرق مخلفات","تحميل مياه جوفية في صهاريج","تصريف / كب صرف صحي","رمي نفايات عامة","تسرب زيوت أو مواد كيميائية","حفر آبار غير مصرح"];
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
/* working days are Mon–Fri; a visit on Sat/Sun is a duty day («مناوب») */
const isWeekend=d=>{const g=parseISO(d).getDay();return g===0||g===6};
/* a working day without visits: the inspector says what it was (shown in Excel, sheet «سجل الأيام») */
const DAY_ST=["اجتماع","مكتب","إجازة"];
const DAY_WINDOW=7; /* days back (today included) in which a day status can still be set or changed */
/* rough bounding boxes [latMin,latMax,lngMin,lngMax] used only to flag a visit for review when its
   coordinates fall outside the area picked. Approximate on purpose — adjust here if a real site falls outside. */
const AREA_BOX={
  "ليوا":[22.80,23.40,53.00,54.45],
  "حبشان":[23.72,23.98,53.45,53.85],
  "مدينة زايد":[23.55,23.80,53.58,53.88],
  "الرويس":[23.98,24.22,52.55,52.90],
  "المرفأ":[23.92,24.22,53.25,53.90],
  "غياثي":[23.70,24.00,52.62,52.98],
  "السلع":[23.88,24.15,51.55,51.95]
};
const REVIEW="يحتاج مراجعة";
function geoIssue(v){
  if(!v.lat||!v.lng)return "بدون إحداثية";
  if(v.geo==="paste")return "إحداثية مدخلة يدويًا";
  const b=AREA_BOX[v.area];if(!b)return "";
  const a=+v.lat,o=+v.lng;return(a<b[0]||a>b[1]||o<b[2]||o>b[3])?"الموقع لا يطابق المنطقة":""}
/* periodic report periods — names must match the Excel «التقرير الدوري» list (PERIODS in make_xlsx.py) */
const PERIODS=[["الربع الأول",1,3],["الربع الثاني",4,6],["الربع الثالث",7,9],["الربع الرابع",10,12],["النصف الأول",1,6],["النصف الثاني",7,12],["التقرير السنوي",1,12]];
const curPeriod=()=>{const y=+(S.pYear||today().slice(0,4)),p=PERIODS.find(x=>x[0]===S.pName)||PERIODS[Math.floor((+today().slice(5,7)-1)/3)];return{y,p}};
/* the smallest period of one year that holds [a,b] (for a custom range that spans months) */
function periodFor(a,b){if(a.slice(0,4)!==b.slice(0,4))return null;const m1=+a.slice(5,7),m2=+b.slice(5,7);
  return PERIODS.filter(p=>p[1]<=m1&&p[2]>=m2).sort((x,y)=>(x[2]-x[1])-(y[2]-y[1]))[0]||null}
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const IC={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  zip:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
};

/* ---------------- utils ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,"0");
const isoDate=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const hhmm=d=>p2(d.getHours())+":"+p2(d.getMinutes());
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>isoDate(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d)};
const weekStart=s=>{const d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDate(d)};
const longDate=s=>{const d=parseISO(s);return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};
const shortDate=s=>{const d=parseISO(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
const safeName=s=>String(s||"").replace(/[\\/:*?"<>|]/g,"-").trim();
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200)}

/* ---------------- storage (IndexedDB, falls back to memory) ---------------- */
const mem={visits:new Map(),photos:new Map(),kv:new Map()};
const DB={db:null,ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open("field-inspection",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("visits",{keyPath:"id"});d.createObjectStore("photos",{keyPath:"id"});d.createObjectStore("kv")};
    r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  run(store,mode,fn){if(!this.ok)return Promise.resolve(fn(null));
    return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));let out;if(r)r.onsuccess=()=>{out=r.result};
      t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  all(s){return this.ok?this.run(s,"readonly",o=>o.getAll()):Promise.resolve([...mem[s].values()])},
  get(s,k){return this.ok?this.run(s,"readonly",o=>o.get(k)):Promise.resolve(mem[s].get(k))},
  put(s,v,k){if(!this.ok){mem[s].set(k!==undefined?k:v.id,v);return Promise.resolve()}return this.run(s,"readwrite",o=>o.put(v,k))},
  del(s,k){if(!this.ok){mem[s].delete(k);return Promise.resolve()}return this.run(s,"readwrite",o=>o.delete(k))},
  clear(s){if(!this.ok){mem[s].clear();return Promise.resolve()}return this.run(s,"readwrite",o=>o.clear())}
};

/* ---------------- state ---------------- */
const S={settings:null,visits:[],view:"today",editId:null,geoBlocked:false,speechBlocked:false,
  range:"week",from:"",to:"",busy:false,addingSite:false,addingType:null,armed:null,lastExport:null,storageWarn:false,dirty:new Set(),pendingPhotos:0,appDirty:false,syncing:false,cloudChecked:false,chat:[],aiBusy:false,aiOff:false,undo:{},importOpen:false};
const urls=new Map();
/* photo ids: "a:<assetId>:<takenAt>" = stored in the cloud, "l:<key>:<takenAt>" = waiting on this device */
const isCloudPh=id=>String(id).startsWith("a:");
const phAsset=id=>String(id).split(":")[1];
const localKey=id=>String(id).startsWith("l:")?String(id).split(":")[1]:String(id);
const phTime=id=>{const t=+String(id).split(":")[2];return t||Date.now()};
async function photoURL(id){if(urls.has(id))return urls.get(id);
  if(isCloudPh(id)){const u="/_blob/"+phAsset(id);urls.set(id,u);return u}
  const p=await DB.get("photos",localKey(id)).catch(()=>null);if(!p)return "";const u=URL.createObjectURL(p.blob);urls.set(id,u);return u}
async function getPhotoBlob(id){
  if(isCloudPh(id)){try{const r=await fetch("/_blob/"+phAsset(id));return r.ok?await r.blob():null}catch(e){return null}}
  const p=await DB.get("photos",localKey(id)).catch(()=>null);return p?p.blob:null}
async function delPhoto(id){
  if(isCloudPh(id)){if(Cloud.assets){try{await Cloud.assets.delete(phAsset(id))}catch(e){}}}
  else await DB.del("photos",localKey(id)).catch(()=>{})}

/* ---------------- cloud (claude.ai account storage) ---------------- */
const Cloud={ok:false,db:null,assets:null,col:null,app:null,
  async init(){
    if(!(window.claude&&window.claude.use))return false;
    try{const[db,user,assets]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets")]);
      if(!db||!user)return false;const id=await user.id();if(!id)return false;
      this.db=db;this.assets=assets;this.app=db.doc("data/users/"+id+"/app");this.col=this.app.collection("visits");this.ok=true;return true}
    catch(e){return false}}};
const chains=new Map();
function pushVisit(v){
  if(!Cloud.ok)return Promise.resolve();
  const body=JSON.parse(JSON.stringify(v));
  const next=(chains.get(v.id)||Promise.resolve()).then(()=>Cloud.col.doc(v.id).set(body))
    .then(()=>{S.dirty.delete(v.id);syncState()}).catch(()=>{S.dirty.add(v.id);syncState()});
  chains.set(v.id,next);return next}
let appChain=Promise.resolve();
function pushApp(){if(!Cloud.ok)return;const body={settings:JSON.parse(JSON.stringify(S.settings)),lastExport:S.lastExport||""};
  appChain=appChain.then(()=>Cloud.app.set(body)).catch(()=>{S.appDirty=true;syncState()})}
function syncState(){const el=$("#savedState");if(!el)return;
  el.textContent=!Cloud.ok?"محفوظ على الجهاز":(S.dirty.size||S.pendingPhotos)?"بانتظار الإنترنت للرفع":"محفوظ في حسابك"}
async function syncPending(){
  if(!Cloud.ok||S.syncing)return;S.syncing=true;
  try{
    for(const id of [...S.dirty]){const v=visit(id);if(v)await pushVisit(v);else S.dirty.delete(id)}
    if(S.appDirty){S.appDirty=false;pushApp()}
    let pend=0;
    if(Cloud.assets){for(const v of S.visits){let changed=false;
      for(const o of v.obs){for(let i=0;i<o.photos.length;i++){const id=o.photos[i];if(isCloudPh(id))continue;
        const p=await DB.get("photos",localKey(id)).catch(()=>null);if(!p){continue}
        try{const r=await Cloud.assets.upload(p.blob,{type:"image/jpeg"});o.photos[i]="a:"+r.id+":"+phTime(id);changed=true;
          await DB.del("photos",localKey(id)).catch(()=>{})}catch(e){pend++}}}
      if(changed){await DB.put("visits",v).catch(()=>{});await pushVisit(v)}}}
    S.pendingPhotos=pend;
  }finally{S.syncing=false;syncState()}}
window.addEventListener("online",()=>syncPending());
setInterval(()=>{if(S.dirty.size||S.pendingPhotos||S.appDirty)syncPending()},45000);

function defaults(){return{name:"جاسم الحمادي",areas:JSON.parse(JSON.stringify(DEFAULT_AREAS)),types:DEFAULT_TYPES.slice(),companies:DEFAULT_COMPANIES.slice()}}
function fixSettings(st){if(!Array.isArray(st.companies))st.companies=DEFAULT_COMPANIES.slice();
  if(!st.dayStatus||typeof st.dayStatus!=="object")st.dayStatus={};if(!st.since)st.since=today();
  /* 2026-11: «بدع زايد» renamed «مدينة زايد» */
  const OLD="بدع زايد",NEW="مدينة زايد";
  if(st.areas&&st.areas[OLD]){const sites=st.areas[OLD].map(x=>x===OLD?NEW:x);const out={};
    for(const k of Object.keys(st.areas)){if(k===OLD){if(!out[NEW])out[NEW]=[];for(const x of sites)if(!out[NEW].includes(x))out[NEW].push(x)}
      else if(k===NEW){out[NEW]=out[NEW]||[];for(const x of st.areas[k])if(!out[NEW].includes(x))out[NEW].push(x)}else out[k]=st.areas[k]}
    st.areas=out}
  return st}
function fixVisits(){for(const v of S.visits){let ch=false;if(v.area==="بدع زايد"){v.area="مدينة زايد";ch=true}if(v.site==="بدع زايد"){v.site="مدينة زايد";ch=true}if(ch)saveVisit(v,true)}}
async function saveSettings(){try{await DB.put("kv",S.settings,"settings")}catch(e){}pushApp()}
const saveTimers=new Map();
function saveVisit(v,now){v.updatedAt=Date.now();const go=()=>DB.put("visits",v).catch(()=>{}).then(()=>pushVisit(v)).then(syncState);
  clearTimeout(saveTimers.get(v.id));if(now)return go();saveTimers.set(v.id,setTimeout(go,350))}
const visit=id=>S.visits.find(v=>v.id===id);
const effObs=v=>v.obs.length?v.obs:[{id:"_",type:NO_OBS,desc:"",action:A_NONE,photos:[]}];
const isSurv=v=>!!v&&v.kind==="survey";
function stats(list){let o=0,x=0,only=0,clean=0,pics=0,surv=0;for(const v of list){const ob=effObs(v);
  if(isSurv(v)){surv++;for(const a of ob)pics+=a.photos.length;continue}
  if(ob.length===1&&ob[0].type===NO_OBS)clean++;for(const a of ob){if(a.type!==NO_OBS)o++;if(a.action===A_VIOL)x++;if(a.action===A_OBS)only++;pics+=a.photos.length}}return{visits:list.length,obs:o,viol:x,only,clean,pics,surv}}
const sortVisits=l=>l.slice().sort((a,b)=>(a.date+(a.arrival||"")).localeCompare(b.date+(b.arrival||"")));

/* ---------------- top bar & tabs ---------------- */
function renderTop(){
  const tb=$("#topbar");
  if(S.view==="visit"){const v=visit(S.editId);
    tb.innerHTML=`<button class="back" data-act="back">${IC.back}رجوع</button><div class="who">${v?esc(longDate(v.date)):""}</div>`;return}
  tb.innerHTML=`<h1 class="brand">دفتر التفتيش<small>تسجيل الزيارات الميدانية</small></h1><div class="who">${esc(S.settings.name)}</div>`;
}

}

/* ---------------- shared bits ---------------- */
function visitTags(v){const s=stats([v]);const t=[];if(v.src==="siri"||v.src==="voice")t.push('<span class="pill siri">صوتي</span>');
  if(v.status==="open")t.push('<span class="pill live">جارية</span>');
  if(v.date&&isWeekend(v.date))t.push('<span class="pill duty">مناوب</span>');
  if(v.status!=="open"&&geoIssue(v))t.push('<span class="pill review">'+REVIEW+'</span>');
  if(isSurv(v)){t.push('<span class="pill surv">معاينة</span>');return t.join("")}
  if(s.viol)t.push(`<span class="pill viol">مخالفة${s.viol>1?" ×"+s.viol:""}</span>`);
  else if(s.only)t.push(`<span class="pill obs">مشاهدة${s.only>1?" ×"+s.only:""}</span>`);
  else if(s.clean)t.push('<span class="pill ok">بلا مشاهدات</span>');
  return t.join("")}
function visitRow(v,showDate){const ob=effObs(v);const sum=isSurv(v)?[SURV,v.sv.farmNo?"رقم "+v.sv.farmNo:"",v.sv.owner].filter(Boolean).join(" · "):ob.map(o=>o.type).filter((x,i,a)=>a.indexOf(x)===i).join("، ");const pics=stats([v]).pics;
  return `<button class="vrow" data-act="edit" data-id="${v.id}"><div class="vtime">${showDate?esc(DAYS[parseISO(v.date).getDay()]):esc(v.arrival||v.departure||"--:--")}</div>
  <div class="vmain"><b>${esc(v.area||"—")} · ${esc(v.site||"بدون موقع")}</b><span>${esc(sum)}${pics?" · "+pics+" صور":""}</span></div><div class="vtags">${visitTags(v)}</div></button>`}
function statTiles(s,label){return `<div class="stats" aria-label="${esc(label)}"><div class="stat v"><b>${s.visits}</b><span>الزيارات</span></div><div class="stat o"><b>${s.obs}</b><span>المشاهدات</span></div><div class="stat x"><b>${s.viol}</b><span>المخالفات</span></div></div>`}

/* ---------------- working days without visits ---------------- */
/* Mon–Fri days of the last 7 days (today included) with no visit at all — his rule (2026-11-13): a status can be set
   within one week only; after that the day stays as it is (empty = «غير محدد»). The inspector marks each one
   اجتماع / مكتب / إجازة. Tapping the chosen status again clears it. Only the status can be set:
   a visit can never be added to a past day. */
function emptyWorkDays(){const t=today(),busy=new Set(S.visits.map(v=>v.date));
  const first=S.visits.reduce((m,v)=>v.date<m?v.date:m,S.settings.since||t);const out=[];
  for(let i=DAY_WINDOW-1;i>=0;i--){const d=addDays(t,-i);if(d<first||isWeekend(d)||busy.has(d))continue;out.push(d)}
  return out.reverse()}
function dayStatusCard(){const days=emptyWorkDays();if(!days.length)return "";const m=S.settings.dayStatus||{};
  const pending=days.filter(d=>!m[d]).length;
  return `<details class="card" ${pending?"open":""}><summary><b>أيام دوام بدون زيارات</b> <span class="small muted">${pending?pending+" بدون تحديد":"كلها محددة"}</span></summary>
  <div class="small muted" style="margin:6px 0">اليوم اللي ما فيه زيارة، حدد شو كان عندك. يظهر في ملف الإكسل. التعديل متاح خلال أسبوع بس، وبعدها اليوم يظل «غير محدد».</div>
  ${days.map(d=>`<div class="day-st"><span>${esc(DAYS[parseISO(d).getDay()])} ${esc(shortDate(d))}${d===today()?" (اليوم)":""}</span>
    <div class="chips">${DAY_ST.map(x=>`<button class="chip" data-act="dayst" data-d="${d}" data-v="${x}" aria-pressed="${m[d]===x}">${x}</button>`).join("")}</div></div>`).join("")}
  </details>`}

function rangeDates(){const d=today();

  const v=visit(S.editId);if(!v){f.innerHTML="";return}
  f.innerHTML=`<div class="footer-bar"><div class="wrap"><span class="saved" id="savedState">${Cloud.ok?"محفوظ في حسابك":"محفوظ على الجهاز"}</span>
   ${v.status==="open"?`<button class="btn primary" data-act="finish">${IC.check}${isSurv(v)?"إنهاء المعاينة":"إنهاء الزيارة"}</button>`:`<button class="btn primary" data-act="back">تم</button>`}</div></div>`;
}
async function hydrateThumbs(){for(const img of document.querySelectorAll("img[data-pid]")){if(!img.src){const u=await photoURL(img.dataset.pid);if(u)img.src=u}}}

function render(keepScroll){
  const y=window.scrollY;
  renderTop();renderTabs();
  const v=$("#view");
  v.innerHTML=S.view==="today"?vToday():S.view==="log"?vLog():S.view==="export"?vExport():S.view==="settings"?vSettings():S.view==="assist"?vAssist():vVisit();
  renderFooter();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  hydrateThumbs();
}

/* ---------------- actions ---------------- */
async function newVisit(){
  const now=new Date(),d=today();
  const v={id:uid(),date:d,area:"",site:"",arrival:hhmm(now),departure:"",lat:"",lng:"",acc:"",obs:[],notes:"",status:"open",createdAt:Date.now(),updatedAt:Date.now()};
  S.visits.push(v);await saveVisit(v,true);
  S.view="visit";S.editId=v.id;S.addingSite=false;render();
  locate(v,true);
}
function locate(v,quiet){
  if(!navigator.geolocation){S.geoBlocked=true;render(true);return}
  if(!quiet)toast("جاري تحديد الموقع…");
  navigator.geolocation.getCurrentPosition(p=>{
    v.lat=p.coords.latitude.toFixed(6);v.lng=p.coords.longitude.toFixed(6);v.acc=Math.round(p.coords.accuracy);v.geo="gps";
    saveVisit(v,true);if(S.view==="visit"&&S.editId===v.id)render(true);if(!quiet)toast("تم تحديد الموقع");
  },err=>{S.geoBlocked=true;if(S.view==="visit")render(true);if(!quiet||err.code!==1)toast(err.code===1?"تحديد الموقع غير مسموح هنا — الصق الإحداثيات":"تعذر تحديد الموقع — الصق الإحداثيات")},
  {enableHighAccuracy:true,timeout:15000,maximumAge:20000});
}
function parseCoords(t){
  const m=String(t).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).match(/(-?\d{1,3}\.\d+)\s*°?\s*([NS])?[^\d\-]+?(-?\d{1,3}\.\d+)\s*°?\s*([EW])?/i);
  if(!m)return null;let a=parseFloat(m[1]),b=parseFloat(m[3]);
  if(m[2]&&/s/i.test(m[2]))a=-a;if(m[4]&&/w/i.test(m[4]))b=-b;
  if(Math.abs(a)>90||Math.abs(b)>180)return null;return[a.toFixed(6),b.toFixed(6)]}

let pendingObs=null;
async function addPhotos(files){
  const v=visit(S.editId);if(!v||!pendingObs)return;const o=v.obs.find(x=>x.id===pendingObs);if(!o)return;
  toast("جاري حفظ الصور…");
  for(const file of files){
    try{const taken=file.lastModified&&Math.abs(Date.now()-file.lastModified)<1000*60*60*24*400?new Date(file.lastModified):new Date();
      await storePhoto(v,o,file,taken);
    }catch(e){toast("تعذر قراءة إحدى الصور")}
  }
  await saveVisit(v,true);render(true);toast(files.length>1?"تم حفظ "+files.length+" صور":"تم حفظ الصورة");
}
async function storePhoto(v,o,src,taken){
  const blob=await stampPhoto(src,v,taken);let id=null;
  if(Cloud.assets){try{const r=await Cloud.assets.upload(blob,{type:"image/jpeg"});id="a:"+r.id+":"+taken.getTime();urls.set(id,r.url)}catch(e){id=null}}
  if(!id){const key=uid();await DB.put("photos",{id:key,blob,visitId:v.id,obsId:o.id,takenAt:taken.getTime()});id="l:"+key+":"+taken.getTime();S.pendingPhotos++}
  o.photos.push(id)}
async function removeVisit(v){
  for(const o of v.obs)for(const p of o.photos)await delPhoto(p);
  await DB.del("visits",v.id).catch(()=>{});if(Cloud.ok){try{await Cloud.col.doc(v.id).delete()}catch(e){}}S.dirty.delete(v.id);S.visits=S.visits.filter(x=>x.id!==v.id)}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function stampPhoto(file,v,taken){
  const im=await loadImage(file);const max=1920;let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.drawImage(im,0,0,w,h);
  const fs=Math.max(15,Math.round(Math.min(w,h)*0.032)),pad=Math.round(fs*.7);
  const lines=[`${taken.getFullYear()}/${p2(taken.getMonth()+1)}/${p2(taken.getDate())}  ${hhmm(taken)}`,`${v.area||""} - ${v.site||""}`];
  if(v.lat&&v.lng)lines.push(`${v.lat}, ${v.lng}`);lines.push(S.settings.name);
  const lh=Math.round(fs*1.35),bh=lines.length*lh+pad*2;
  g.fillStyle="rgba(0,0,0,0.55)";g.fillRect(0,h-bh,w,bh);
  g.fillStyle="#FFFFFF";g.font=`600 ${fs}px "Readex Pro",Tahoma,Arial,sans-serif`;g.textBaseline="top";
  try{g.direction="rtl"}catch(e){}g.textAlign="right";
  lines.forEach((t,i)=>{const ltr=/^-?\d+\.\d+, -?\d+\.\d+$/.test(t);try{g.direction=ltr?"ltr":"rtl"}catch(e){}g.fillText(t,w-pad,h-bh+pad+i*lh)});
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),"image/jpeg",0.82));
}

let rec=null;
function dictate(oid,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  if(rec){try{rec.stop()}catch(e){}rec=null;return}
  const ta=document.querySelector(`textarea[data-oid="${oid}"]`);const base=ta.value.trim();
  try{rec=new SR()}catch(e){S.speechBlocked=true;render(true);return}
  rec.lang="ar-AE";rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{const parts=[];for(let i=0;i<e.results.length;i++)parts.push(e.results[i][0].transcript.trim());const s=parts.filter(Boolean).join(" ").replace(/\s+/g," ");ta.value=(base?base+" ":"")+s;ta.dispatchEvent(new Event("input",{bubbles:true}))};
  rec.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){S.speechBlocked=true;toast("المايك غير متاح هنا — استخدم مايك لوحة المفاتيح");render(true)}};
  rec.onend=()=>{rec=null;document.querySelectorAll(".mic.rec").forEach(b=>{b.classList.remove("rec");b.innerHTML=IC.mic+"إملاء صوتي"})};
  try{rec.start();btn.classList.add("rec");btn.innerHTML=IC.mic+"إيقاف الإملاء"}catch(e){rec=null;S.speechBlocked=true;render(true)}
}

function cellXml(ref,sAttr,val){
  if(val==null||val==="")return `<c r="${ref}"${sAttr}/>`;
  if(typeof val==="number")return `<c r="${ref}"${sAttr}><v>${val}</v></c>`;
  return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`}
function patchRow(rowXml,cells){const ov=cells._s||{};
  return rowXml.replace(/<c r="([A-Z]+)(\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g,(m,col,rn,attrs)=>{
    if(!(col in cells)||col==="_s")return m;const s=ov[col]||(attrs.match(/\ss="\d+"/)||[""])[0];return cellXml(col+rn,s,cells[col])})}
function patchSheet(xml,rows){
  return xml.replace(/<row r="(\d+)"([^>]*?)(\/>|>[\s\S]*?<\/row>)/g,(m,rn)=>rows[rn]?patchRow(m,rows[rn]):m)}

    rows[r]._s=unl;r++}}

  const st=S.settings,areas=Object.keys(st.areas).slice(0,10);const set={3:{B:st.name}};
  set[11]={};COLS.forEach((c,j)=>set[11][c]=areas[j]||"");
  for(let i=0;i<50;i++){const rr=12+i;set[rr]={};COLS.forEach((c,j)=>set[rr][c]=(areas[j]&&st.areas[areas[j]][i])||"")}

    obj(x.img,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${x.p.w} /Height ${x.p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${x.p.jpg.length} >>\nstream\n`);add(x.p.jpg);add("\nendstream")});

function vaSetArea(v,a){v.area=a;if(!(S.settings.areas[a]||[]).includes(v.site))v.site="";

function vaBack(){

    case "svStep":if(v&&v.sv){const k=b.dataset.k;v.sv[k]=Math.max(0,svN(v.sv[k])+(+b.dataset.d));saveVisit(v);render(true)}return;
    case "saveCo":{const n=(($("#newCoInline")||{}).value||"").trim();if(!n||!v)return toast("اكتب اسم الشركة");
      S.settings.companies=S.settings.companies||[];if(!S.settings.companies.includes(n)){S.settings.companies.push(n);await saveSettings()}
      v.sv.company=n;S.addingCo=false;saveVisit(v);toast("أضيفت «"+n+"»");return render(true)}
    case "cancelCo":S.addingCo=false;return render(true);
    case "svPdf":if(v&&isSurv(v))return svMakePdf(v);return;
    case "svSend":if(v&&isSurv(v))return svSend(v);return;
    case "svSave":if(v&&isSurv(v)&&svFresh(v)){if(await offerFile(S.pdf.name,S.pdf.blob))toast("انحفظ النموذج")}return;
    case "addCo":{const n=(($("#newCo")||{}).value||"").trim();if(!n)return;S.settings.companies=S.settings.companies||[];if(!S.settings.companies.includes(n))S.settings.companies.push(n);await saveSettings();return render(true)}
    case "rmCo":S.settings.companies.splice(+b.dataset.i,1);await saveSettings();return render(true);
    case "va":return vaStart();
    case "delOpen":{const x=visit(b.dataset.id);if(!x)return;const k="del"+x.id;
      if(S.armed!==k){S.armed=k;render(true);setTimeout(()=>{if(S.armed===k){S.armed=null;render(true)}},4000);return}
      await removeVisit(x);S.armed=null;toast("تم حذف الزيارة");return render(true)}
    case "dayst":{const d=b.dataset.d,st=b.dataset.v;if(d<addDays(today(),-(DAY_WINDOW-1)))return toast("مر عليه أكثر من أسبوع، ما يتعدل");const m=S.settings.dayStatus=S.settings.dayStatus||{};
      if(m[d]===st)delete m[d];else m[d]=st;await saveSettings();return render(true)}
    case "edit":S.view="visit";S.editId=b.dataset.id;S.addingSite=false;S.addingCo=false;S.addingType=null;S.armed=null;return render();
    case "back":S.view="today";S.editId=null;S.armed=null;return render();
    case "area":if(!v)return;v.area=b.dataset.v;if(!(S.settings.areas[v.area]||[]).includes(v.site))v.site="";S.addingSite=false;saveVisit(v);return render(true);
    case "saveSite":{const inp=$("#newSite");const n=(inp&&inp.value||"").trim();if(!n||!v)return toast("اكتب اسم الموقع");
      const l=S.settings.areas[v.area];if(!l.includes(n)){l.push(n);await saveSettings()}v.site=n;S.addingSite=false;saveVisit(v);toast("أضيف «"+n+"» للقائمة");return render(true)}
    case "cancelSite":S.addingSite=false;return render(true);
    case "locate":if(v)locate(v);return;
    case "clearCoord":if(v){v.lat=v.lng=v.acc=v.geo="";saveVisit(v);render(true)}return;
    case "leaveNow":if(v){v.departure=hhmm(new Date());saveVisit(v);render(true)}return;
    case "addObs":if(v){v.obs.push({id:uid(),type:"",desc:"",action:A_OBS,photos:[]});saveVisit(v);render(true);
      setTimeout(()=>{const c=document.querySelector(`.obs-card[data-oid="${v.obs[v.obs.length-1].id}"]`);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},50)}return;
    case "noObs":if(v){v.obs=[{id:uid(),type:NO_OBS,desc:"",action:A_NONE,photos:[]}];saveVisit(v);render(true)}return;
    case "rmObs":{if(!v)return;const id=b.dataset.oid;const o=v.obs.find(x=>x.id===id);if(!o)return;
      const empty=!o.desc&&!o.photos.length&&(!o.type||o.type===NO_OBS);
      if(!empty&&S.armed!=="o"+id){S.armed="o"+id;render(true);setTimeout(()=>{if(S.armed==="o"+id){S.armed=null;render(true)}},4000);return}
      for(const p of o.photos){await delPhoto(p)}
      v.obs=v.obs.filter(x=>x.id!==id);S.armed=null;saveVisit(v);return render(true)}
    case "action":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(o){o.action=b.dataset.v;saveVisit(v);render(true)}return}
    case "saveTypeInline":{const n=($("#newTypeInline")||{}).value;const t=(n||"").trim();if(!t)return toast("اكتب اسم النوع");
      if(!S.settings.types.includes(t)){S.settings.types.push(t);await saveSettings()}
      const o=v&&v.obs.find(x=>x.id===b.dataset.oid);if(o)o.type=t;S.addingType=null;if(v)saveVisit(v);toast("أضيف «"+t+"» للأنواع");return render(true)}
    case "cancelType":S.addingType=null;return render(true);
    case "cam":pendingObs=b.dataset.oid;$("#camIn").value="";return $("#camIn").click();
    case "gal":pendingObs=b.dataset.oid;$("#galIn").value="";return $("#galIn").click();
    case "rmPhoto":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(!o)return;o.photos=o.photos.filter(p=>p!==b.dataset.pid);
      await delPhoto(b.dataset.pid);saveVisit(v);return render(true)}
    case "mic":return dictate(b.dataset.oid,b);
    case "finish":{if(!v)return;
      if(!v.lat||!v.lng)return toast("لازم تسجل الإحداثيات قبل الإنهاء: اضغط «تحديد موقعي الحالي»");
      if(isSurv(v)){const m=svCheck(v);if(m)return toast(m);if(!v.departure)v.departure=hhmm(new Date());v.status="done";await saveVisit(v,true);toast("انحفظت المعاينة");return svMakePdf(v)}
      if(!v.area||!v.site)return toast("اختر المنطقة والموقع قبل الإنهاء");
      if(v.obs.some(o=>!o.type))return toast("حدد نوع كل مشاهدة، أو احذف الفاضية");
      if(!v.departure)v.departure=hhmm(new Date());v.status="done";await saveVisit(v,true);
      S.view="today";S.editId=null;toast("تم حفظ الزيارة");return render()}
    case "delVisit":{if(!v)return;if(S.armed!=="visit"){S.armed="visit";render(true);setTimeout(()=>{if(S.armed==="visit"){S.armed=null;render(true)}},4000);return}
      await removeVisit(v);S.armed=null;S.view="today";S.editId=null;toast("تم حذف الزيارة");return render()}
    case "range":S.range=b.dataset.v;return render(true);
    case "zip":return doExport(true);
    case "report":return doExport(false);
    case "addSite":{const a=b.dataset.a;const inp=document.querySelector(`[data-addsite="${CSS.escape(a)}"]`);const n=(inp&&inp.value||"").trim();if(!n)return;
      if(!S.settings.areas[a].includes(n))S.settings.areas[a].push(n);await saveSettings();toast("أضيف «"+n+"»");render(true);
      const d=[...document.querySelectorAll("details.area")].find(x=>x.querySelector("summary span").textContent===a);if(d)d.open=true;return}
    case "rmSite":{const a=b.dataset.a;S.settings.areas[a].splice(+b.dataset.i,1);await saveSettings();render(true);
      const d=[...document.querySelectorAll("details.area")].find(x=>x.querySelector("summary span").textContent===a);if(d)d.open=true;return}
    case "addArea":{const n=($("#newArea").value||"").trim();if(!n)return;if(!S.settings.areas[n])S.settings.areas[n]=[];await saveSettings();toast("أضيفت منطقة «"+n+"»");return render(true)}
    case "addType":{const n=($("#newType").value||"").trim();if(!n)return;if(!S.settings.types.includes(n))S.settings.types.push(n);await saveSettings();return render(true)}
    case "rmType":S.settings.types.splice(+b.dataset.i,1);await saveSettings();return render(true);
    case "siri":$("#siriIn").value="";return $("#siriIn").click();
    case "copyPrompt":{const t=($("#drivePrompt")||{}).textContent||"";
      try{await navigator.clipboard.writeText(t);toast("تم النسخ")}catch(e){const r=document.createRange();const el=$("#drivePrompt");if(el){r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast("حدّدت النص، اضغط نسخ")}return}
    case "impOpen":S.importOpen=true;render(true);setTimeout(()=>{const t=$("#impText");if(t)t.focus()},50);return;
    case "impClose":S.importOpen=false;return render(true);
    case "impPaste":{const t=($("#impText")||{}).value||"";if(!t.trim())return toast("الصق رد المساعد أول");S.importOpen=false;return importSiri(t)}
    case "ask":{const q=$("#aiQ");const t=q?q.value:"";if(q)q.value="";return askAI(t)}
    case "askSug":return askAI(b.dataset.q);
    case "clearChat":S.chat=[];return render(true);
    case "aiSummary":return aiSummary();
    case "autoSum":{const t=$("#repNote"),cur=((t&&t.value)||getNote()).trim();
      if(cur&&S.armed!=="autoSum"){S.armed="autoSum";render(true);setTimeout(()=>{if(S.armed==="autoSum"){S.armed=null;render(true)}},4000);return}
      S.armed=null;const txt=autoSummary();if(!txt)return toast("ما فيه زيارات منتهية في هالفترة");
      setNote(txt);render(true);return toast("انكتب الملخص، راجعه وعدّل إذا تبي")}
    case "formal":return aiFormal(b.dataset.oid);
    case "undoFormal":{if(!v)return;const o=v.obs.find(x=>x.id===b.dataset.oid);if(o&&S.undo[o.id]!=null){o.desc=S.undo[o.id];delete S.undo[o.id];saveVisit(v);render(true)}return}
    case "wipe":if(S.armed!=="wipe"){S.armed="wipe";render(true);setTimeout(()=>{if(S.armed==="wipe"){S.armed=null;render(true)}},5000);return}
      for(const v of S.visits){for(const o of v.obs)for(const p of o.photos)await delPhoto(p);if(Cloud.ok){try{await Cloud.col.doc(v.id).delete()}catch(e){}}}
      await DB.clear("visits").catch(()=>{});await DB.clear("photos").catch(()=>{});S.visits=[];S.dirty.clear();S.armed=null;toast("تم حذف كل البيانات");return render();
  }
});
document.addEventListener("input",e=>{
  const t=e.target,v=visit(S.editId);
  if(t.id==="setName"){S.settings.name=t.value;saveSettingsSoon();return}
  if(t.id==="repNote"){setNote(t.value);return}
  if(t.id==="coordPaste"&&v){const c=parseCoords(t.value);if(c){v.lat=c[0];v.lng=c[1];v.acc="";v.geo="paste";saveVisit(v);render(true);toast("تم حفظ الإحداثيات")}return}
  if(!v)return;
  if(t.dataset.sf&&v.sv){v.sv[t.dataset.sf]=t.dataset.num?normDigits(t.value).replace(/\D/g,""):t.value;saveVisit(v);return}
  if(t.dataset.vf){if(t.dataset.vf==="date"&&!t.value)return;v[t.dataset.vf]=t.value;saveVisit(v);if(t.dataset.vf==="date"){renderTop();}return}
  if(t.dataset.of==="desc"){const o=v.obs.find(x=>x.id===t.dataset.oid);if(o){o.desc=t.value;saveVisit(v)}}
});
document.addEventListener("change",e=>{
  const t=e.target,v=visit(S.editId);
  if(t.id==="rFrom"){S.from=t.value;return render(true)}
  if(t.id==="pYear"){S.pYear=t.value;return render(true)}
  if(t.id==="pName"){S.pName=t.value;return render(true)}
  if(t.id==="rTo"){S.to=t.value;return render(true)}
  if(t.id==="coSel"&&v&&v.sv){if(t.value==="__new"){S.addingCo=true;return render(true)}v.sv.company=t.value;saveVisit(v);return}
  if(t.dataset.sf&&t.dataset.num&&v&&v.sv)return render(true);
  if(t.id==="siteSel"&&v){if(t.value==="__new"){S.addingSite=true;return render(true)}v.site=t.value;saveVisit(v);return}
  if(t.dataset.of==="type"&&v){const o=v.obs.find(x=>x.id===t.dataset.oid);if(!o)return;
    if(t.value==="__new"){S.addingType=o.id;return render(true)}o.type=t.value;saveVisit(v);return render(true)}
  if(t.dataset.vf==="date"&&v)render(true);
  if(t.id==="siriIn"){const f=t.files&&t.files[0];if(f)importSiri(f);return}
  if(t.id==="camIn"||t.id==="galIn"){const fs=[...t.files];if(fs.length)addPhotos(fs)}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;
  if(t.id==="newSite"){e.preventDefault();document.querySelector('[data-act="saveSite"]').click()}
  if(t.id==="newTypeInline"){e.preventDefault();document.querySelector('[data-act="saveTypeInline"]').click()}
  if(t.dataset&&t.dataset.addsite){e.preventDefault();t.nextElementSibling.click()}
  if(t.id==="newArea"){e.preventDefault();document.querySelector('[data-act="addArea"]').click()}
  if(t.id==="newCoInline"){e.preventDefault();document.querySelector('[data-act="saveCo"]').click()}
  if(t.id==="newCo"){e.preventDefault();document.querySelector('[data-act="addCo"]').click()}
  if(t.id==="newType"){e.preventDefault();document.querySelector('[data-act="addType"]').click()}
  if(t.id==="aiQ"&&!e.shiftKey){e.preventDefault();document.querySelector('[data-act="ask"]').click()}
});

/* ---------------- boot ---------------- */
(async function boot(){
  S.settings=defaults();render();
  const ok=await DB.open();if(!ok)S.storageWarn=true;
  let st0="";try{const st=await DB.get("kv","settings");if(st&&st.areas){st0=JSON.stringify(st.areas);S.settings=fixSettings(st)}}catch(e){}
  try{S.visits=(await DB.all("visits"))||[]}catch(e){S.visits=[]}
  fixVisits();if(S.settings.areas&&!S.settings.areas["بدع زايد"]&&st0!==JSON.stringify(S.settings.areas))saveSettings();
  try{S.lastExport=(await DB.get("kv","lastExport"))||null}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  render(true);
  await ai();
  const cloud=await Cloud.init();S.cloudChecked=true;
  if(cloud){
    try{const a=await Cloud.app.get();
      if(a.exists){const d=a.data();if(d.settings&&d.settings.areas){const was=JSON.stringify(d.settings.areas);S.settings=fixSettings(JSON.parse(JSON.stringify(d.settings)));if(was!==JSON.stringify(S.settings.areas))pushApp()}if(d.lastExport)S.lastExport=d.lastExport;DB.put("kv",S.settings,"settings").catch(()=>{})}
      else pushApp()}catch(e){}
    try{const snap=await Cloud.col.get();const remote=new Map();snap.docs.forEach(d=>{if(d.exists)remote.set(d.id,JSON.parse(JSON.stringify(d.data())))});
      const merged=new Map(remote);
      for(const v of S.visits){const r=remote.get(v.id);if(!r||(v.updatedAt||0)>(r.updatedAt||0)){merged.set(v.id,v);S.dirty.add(v.id)}}
      S.visits=[...merged.values()];fixVisits();
      for(const v of S.visits)DB.put("visits",v).catch(()=>{});
    }catch(e){}
    syncPending();
  }
  if(S.view==="visit"&&!visit(S.editId)){S.view="today";S.editId=null}
  render(true);
})();
})();
</script>

</body>
